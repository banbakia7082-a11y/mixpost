name: validate-customization

on:
  push:
    branches:
      - feat/affiliate-analytics-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-customization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mixpost_test
          MYSQL_USER: user
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, mysql, pdo_mysql, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        env:
          COMPOSER_ROOT_VERSION: dev-main
        with:
          composer-options: --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: composer test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mixpost_test
          DB_USERNAME: user
          DB_PASSWORD: secret

  frontend-build:
    name: Vue production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        env:
          COMPOSER_ROOT_VERSION: dev-main
        with:
          composer-options: --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
